services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=loan_db
    volumes: 
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    restart: always

  app:
    build: .
    container_name: python_app
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5433/loan_db
